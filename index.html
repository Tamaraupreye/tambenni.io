<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~/tambenni</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      /* Scale with viewport so "you@tambenni:~$ Tam Benni█" (~27ch) always fits on one line */
      --fs: clamp(0.7rem, calc((100vw - 3rem) / 18), 1.4rem);
    }

    body {
      background-color: #141414;
      color: #d4d4d4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      margin: 0;
      padding: 1.5rem;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      /* Terminal block cursor */
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='12' height='20' viewBox='0 0 12 20'><rect width='10' height='18' x='1' y='1' fill='%23d4d4d4'/></svg>") 5 9, auto;
    }

    h1 {
      font-size: var(--fs);
      font-weight: normal;
      line-height: 1.5;
      margin: 0 0 1.25rem 0;
      white-space: nowrap;
    }

    .prompt {
      color: #737373;
    }

    .name-wrap {
      white-space: nowrap;
    }

    .cursor-blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5em 0.75em;
      font-size: clamp(0.6rem, calc((100vw - 3rem) / 28), 1rem);
    }

    .sep {
      color: #525252;
      user-select: none;
    }

    a {
      color: #d4d4d4;
      text-decoration: none;
      padding: 0.375em 0.5em;
      /* Inverted block cursor on link hover */
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='12' height='20' viewBox='0 0 12 20'><rect width='10' height='18' x='1' y='1' fill='%23141414' stroke='%23d4d4d4' stroke-width='1.5'/></svg>") 5 9, pointer;
    }

    a:hover,
    a:active {
      background-color: #d4d4d4;
      color: #141414;
    }
  </style>
</head>
<body>
  <h1><span class="prompt">you@tambenni:~$</span> <span class="name-wrap">Tam Benni<span class="cursor-blink">█</span></span></h1>
  <nav>
    <a target="_blank" rel="noopener noreferrer" href="https://github.com/Tamaraupreye">github</a>
    <span class="sep">|</span>
    <a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/in/tamaraupreye-benni-294b2b14a/">linkedin</a>
    <span class="sep">|</span>
    <a target="_blank" rel="noopener noreferrer" href="resume.pdf">resume</a>
    <span class="sep">|</span>
    <a href="mailto:tamaraupreyebenni@gmail.com">contact</a>
  </nav>
</body>
</html>
